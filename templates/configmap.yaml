apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pelican-cache.fullname" . }}-pelican-config
  labels:
    {{- include "pelican-cache.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data:
{{- if .Values.pelicanConfig }}
{{- range $k, $v := .Values.pelicanConfig }}
  {{ $k }}: |-
{{ $v | nindent 4 }}
{{- end }}
{{- else }}
  README: |-
    Add your /etc/pelican configuration files via values.yaml under:
      pelicanConfig:
        filename: |
          file contents...
{{- end }}
